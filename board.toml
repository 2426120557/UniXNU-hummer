# OnePlus Ace 5 Pro (hummer, SM8750) — 整仓换成 OnePlus 13T (Pagani) 的移植。
#
# 同 SM8750、同一份目标 IPSW（iPad7,1 17.7.11 21H461），所以引擎、补丁、构建
# 流水线全部采用 13T 的（upstream.rev = d9460ebb + patches/ + 13T 构建脚本）。
# 只保留 hummer 自己的设备相关部分：
#   - [firmware] hummerPkg：本机 UEFI 已真机验证，13T 的固件在 Ace 5 Pro 上起不来
#   - [userdata] 本机 GPT 几何
#   - ADT：make-hummer-adt.py（由 13T 的生成器改出，6 核 cpu%d + GICv3 + /psci，
#     cpus=6，走 XNU 标准 PSCI 起从核）
#   - 触屏：hummer 的 Synaptics S3910（13T 是 Novatek，对本机面板无效）
# 首轮触屏默认关闭（hummer-touch=0），先验证 13T 流水线能编出并启动到 Hello。

[board]
name = "hummer"
soc = "SM8750"
description = "OnePlus Ace 5 Pro (SM8750) - full port from OnePlus 13T"
kit = "hummer"

[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["AppleLogo", "KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

[userdata]
first_lba = 0x3a1421
last_lba = 0x3ad07fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# 13T 的归档构建器（引擎脚本 + 13T 的设备脚本），末尾加 hummer 触屏。
[kernel]
defconfig = "hummer_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-libpthread-kernel.py",
  # build-arm-platform.py 只按记录编译 ArmDTPlatform/ArmCpu，不产出归档；
  # 而 13T 的 baseline.sh 硬性要求这两个归档存在（test -f）：
  #   ARM_DT_ARCHIVE = build/armdt-platform/libArmDTPlatform.a
  #   ARMCPU_ARCHIVE = build/armcpu/libArmCpu.a
  # 这两个路径正是 build-arm-driver.py 的输出目录（见其 out 映射表），
  # 所以必须显式跑这两个构建器。
  "build-arm-platform.py",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-native-aes.py",
  "build-native-ufs.py --root-windows",
  "build-ufs-storage-bindings.py --kernelcache ../../ipsw/21H461/kernelcache.decompressed",
  "build-native-ufs.py --component NativeVirtioBlock --root-windows",
  "build-native-ufs.py --component NativeRamBlock --root-windows",
  "build-sheng-platform-power.py --kernelcache ../../ipsw/21H461/kernelcache.decompressed",
  "build-verified-root-probe.py --component os --include-systemos",
  "build-stage7-display.py --kernelcache ../../ipsw/21H461/kernelcache.decompressed",
  # hummer 触屏（S3910 @ GENI SPI4）；触发点在 scripts/pmgr/ShengPlatformPower.cpp
  # 的 sheng_pmgr_run() 末尾（弱引用）。默认不跑（hummer-touch=0）。
  "build-hummer-touch.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.iokit.IOStorageFamily", "com.apple.filesystems.apfs",
  "com.apple.driver.AppleMobileFileIntegrity", "com.apple.kext.CoreTrust",
  "com.apple.security.sandbox", "com.apple.driver.ApplePMGR",
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.iokit.IOSurface", "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOHIDFamily", "com.apple.iokit.IOHIDEventDriver",
]

[payload]
volume = "UNIXNUHUMMER"
size_mib = 160
loader = "firmware"
title = "OnePlus Ace 5 Pro Stage 7"
dram_size = "0x100000000"
timeout = 10
# 跳过 Setup（Hello 页）：payload 步骤用 seed-data-skip-setup.py 在 Data 种子的**副本**上
# 展开 APFS、rw 挂载、把 Setup 标记为完成（com.apple.purplebuddy 的 SetupDone /
# SetupFinishedAllSteps、notbackedup 的 mini-buddy 全 false、managedconfiguration 不提示
# 云配置、migration 的 buildVersion=21H461），原始种子不变，改好的副本当 scratch-data.img。
# 脚本用本 repo scripts/ 里的那份：它支持 --no-auto-dim，而引擎 upstream.rev=d9460ebb 的
# 同名脚本是 `len(sys.argv)!=3` 就退出、不接受额外参数。--no-auto-dim 关掉 SpringBoard
# 自动变暗/空闲休眠——本机还没按键、触摸刚接上，不关的话起来约 30 秒就熄屏。
skip_setup_tool = "scripts/seed-data-skip-setup.py"
skip_setup_args = ["--no-auto-dim"]
kernel_args = [
  "-v", "serial=0", "debug=0x14e", "cpus=6", "kt_fixed_zones=240",
  # 根镜像所在分区：编译期由 GccUfs.h 的 UFS_ROOT_PARTITION 决定——SM8750 构建
  # (-DNATIVE_UFS_SM8750=1) 已经锁成 "unixnu"，所以这里不用、也不能用启动参数覆盖。
  "native-ufs-root=1", "native-ufs-diagnostics=1", "sheng-pmgr=2",
  "offline-apfs-load=1", "startup_debug=0", "-no_corpses",
  "sheng-vsync=60", "sheng-vsync-fixed=1", "offline-mobile-graphics-load=1",
  "offline-legacy-register=1", "offline-legacy-phase=4", "offline-legacy-gop=1",
  "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1", "offline-key-events=1", "sheng-aks=1",
  # 多核：ADT 有 6 个 cpu 节点 + /psci，但 ArmCpu::probe 对从核 nub 直接返回 nullptr，
  # 除非给了 sheng-smp=1（drivers/ArmCpu/ArmCpu.cpp 的 probe）。v115 实测
  #   HUMTOUCH cpu processor_count=1 avail=1 cpus_arg=6
  # 所以不是 PSCI 失败，是从核根本没注册。v116 打开：
  #   sheng-smp=1      注册从核，startCPU 里发 PSCI 0.2 CPU_ON
  #   sheng-smp-gic=1  CPU_ON 之前由 boot CPU 唤醒目标核的 GICR（GICv3 必需，
  #                    否则新核在自己的 redistributor 上 wfe 死等）
  # 两个 Oryon prime 核在 MPIDR Affinity2（0x10000/0x10100），而 XNU 的
  # ml_parse_cpu_topology 只用 MPIDR_CLUSTER_ID / MPIDR_CPU_ID（Affinity1/0）
  # 算拓扑，两个核会塌到 logical 0（历史上 AppleS8000CPU 就是这么 panic 的）。
  # 所以这一轮只跑 6 个 Affinity1 核；要 8 核得改引擎侧的亲和性映射。
  # 触屏上报链路（对齐 13T 的四个开关，缺一个都收不到触摸）：
  #   offline-hid-input=1  HummerHidInput 启动（加载 IOHIDFamily/IOHIDEventDriver、
  #                        创建 owned IOHIDDevice）
  #   offline-hid-home=1   上面那段创建条件（13T 就把 Home 开关复用成总闸）
  #   sheng-touch-hid=1    NativeHidInput 才注册 native_touch_set_sink、才拼
  #                        触摸报告描述符、才置 Built-In/DisplayIntegrated
  #   hummer-touch=4       S3910 探针跑到触点轮询并 publish
  # v76 bring-up: 切到 =3 + panic=3 读 IDENTIFY 寄存器，fifo=1 强 FIFO 路径。
  # v76a: 加 memset(rx, 0xaa) 诊断。panic 屏 x0 斜杠后若还是 aa aa aa aa
  #   -> geni_spi_transfer 根本没启动 SCLK（opcode/FIFO_IF_DISABLE 问题）
  #   -> 变成 00/ff/其他 -> 传输跑了，从机没驱动 MISO（供电/复位引脚问题）
  # fifo=0 (DMA) 实测硬复位，无 panic 屏，排除。
  # v111 实测：done s4/4, mx12639 my27799 obj10 cfg128 -> 面板几何是 1264x2780（0.1px
  #   单位），10 个触点对象，配置块 128 字节；cmd-db 布局确认为 slave 8 / data 144，
  #   两路 LDO 地址 0x40800(L4B) / 0x41900(L16B)。
  # v112: panic 关掉，stage 4 之后进触点轮询并往 NativeHidInput publish。
  #   想再要一次"点到为止"的诊断屏就把它改成 9（第一个触点上报时 panic）。
  # v113: 第一次真机触摸的结果是"左右对、上下反"——sheng 那块面板要的 Y 镜像在
  #   hummer 上是多余的，默认关掉（hummer-touch-fy=1 可再打开）。
  "offline-hid-input=1", "offline-hid-home=1", "sheng-touch-hid=1",
  "sheng-smp=1", "sheng-smp-gic=1",
  # v128（抄 UniXNU-sheng）：内核里 HAS_IPI 未定义，XNU 的 IPI 在非 Apple 平台上没有实现，
  #   task_restartable_ranges_synchronize() 等的那个 ACK 永远等不到。sheng 的补丁在
  #   startup.c 里加了 -no_slto_panic，注释原文：
  #     "A thread that waits for an IPI acknowledgement (restartable ranges) then keeps
  #      waiting instead of panicking the whole machine; the other cores keep running."
  #   再配 ml-timeout-lock-panic-scale=40 把锁超时阈值放宽 40 倍。
  #   armcpu-spi-ipi=1 保留：让 ArmCpu::signalCPU 用软件 pend 的 SPI 1008+core 而不是
  #   ICC_SGI1R_EL1（ArmCpu 注释：本板不产生中断），能到就赚到，到不了也只会让那个线程
  #   在超时后继续等，不再拖死整机。
  "armcpu-spi-ipi=1", "-no_slto_panic", "ml-timeout-lock-panic-scale=40",
  "hummer-touch=4", "hummer-touch-panic=0", "hummer-touch-fifo=1",
  "hummer-touch-fy=0",
  # v129 三个实体键（package/HummerButtons.cpp，结构照 UniXNU-sheng 的 ButtonProbe）：
  #   电源   = PMK8550 PON pwrkey（SPMI USID 0，periph 0x13，RT_STS 0x1310 bit7）
  #   音量减 = PM8550 GPIO6（USID 1，periph 0x8d，RT_STS 0x8D10 bit0，低有效，上拉）
  #   音量加 = PMK8550 PON resin（同一 RT_STS 的 bit6）
  #   —— hummer.dts 只给了 GPIO6 这一个 gpio-keys 子节点（vol_down），第二个音量键只能在
  #   RESIN 上；若实测上下相反，改 pressed() 里那两行即可。
  #   SPMI 访问用引擎自带的 BootResetCore.h（br_read8/br_write8），不再自己写一份。
  #   上报走报告 2 的 bit1 Power / bit2 Volume Increment / bit3 Volume Decrement
  #   （drivers/NativeHidInput 的 report 2 已按 ShengHidInput 的定义扩成这四个 usage）。
  #   20 ms 轮询 + 3 次去抖（60 ms，越过 DTS 的 32 ms）。1 = 启用，0 = 关。
  "hummer-keyscan=1",
  # v120 实测（带 hummer-cpu=1 的延迟诊断屏）：
  #   HUMTOUCH cpu processor_count=6 avail=6 max=5 cpus_arg=6
  # 六核全部注册，SMP 通了，所以这里不再带诊断参数。需要再量一次就把
  # "hummer-cpu=1" 加回来（15 秒后 panic 报告核数，hummer-cpu-delay 可调毫秒）。
]
trust_cache_sha256 = ["7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7"]

[payload.adt]
ipad_identity = true
unique_chip_id = "required"
chip_id = "0x8011"
packed_data_ramdisk = true
tool = "scripts/make-hummer-adt.py"
owned_memory_size = "0x100000000"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500"
# 根卷 UUID（与内核 offline-owner-systemos-mount.patch 里发布 boot manifest 的那个一致）
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"

# 本机 UEFI 固件（hummerPkg）：保留，不换 13T 的 oneplus13tPkg。
[firmware]
config = "hummer"
dsc = "Platforms/OnePlus/hummerPkg/hummer.dsc"
fd = "Build/hummerPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}", "{uefi}/Platforms/OnePlus", "{tree}/package",
  "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/OnePlus", "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "hummer-13t-port"

[bootimg]
embed_payload = true
