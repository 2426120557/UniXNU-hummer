# OnePlus Ace 5 Pro (hummer, SM8750, Adreno 830) — format 2 device repository.
#
# 本文件的注释从 v186 起改成英文并与上游格式对齐；v186 之前那一大段中文 bring-up
# 记录（每个 boot arg 是怎么试出来的）保留在 git 历史里（git show v186:board.toml）。
#
# The four profile layers apply in this order and merge by key:
#   arch  UniXNU/profiles/arch/arm64               common ARM64 config and patches
#   soc   feeds.toml "sm8750"                      SM8750 DTSI, fragment, SMP patch
#   os    UniXNU/profiles/os/ipados-17.7.11-21H461 IPSW identity, Apple ADT identity,
#                                                  prelink roots, trust caches
#   device this file + dts/ + configs/ + patches/xnu/series
# Arrays replace the inherited array, so every array below is the complete list
# for this board rather than an addition.
#
# What stays board-specific here, because no shared profile owns it:
#   - the six-core CPU selection and the DRAM window (dts/hummer.dts)
#   - the UEFI firmware (hummerPkg, validated on this phone)
#   - the userdata GPT geometry of this unit
#   - the board driver package (package/, appears as kits/hummer in the tree)
#   - the bring-up kernel arguments in [payload]

schema_version = 2

[board]
name = "hummer"
soc = "SM8750"
soc_source = "sm8750"
os_profile = "ipados-17.7.11-21H461"
description = "OnePlus Ace 5 Pro (PKR110, SM8750) — early userspace, six CPUs, A830 bring-up"
kit = "hummer"

[ipsw]
# url, product, version, build, device_class, chip_id and board_id come from the
# OS profile (the same iPad7,1 21H461 restore every SM8750 port boots).
fetch = ["AppleLogo", "KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

[components]
# Catalog components the kernel and the payload need. Everything else this board
# uses — UFS transport, AES, RAM/VirtIO block, legacy display, key store events,
# boot progress, touch, buttons, the SM8750 GPU platform layer — is board code
# under package/ and is compiled by the archive plan below, not by a catalog
# recipe.
#
# QcomGeniSpi is the GENI SPI controller the S3910 panel sits on; it is an
# embedded component, so it only has to be present in the tree.
#
# Adreno740 is the A830 backend: `unixnu` pins the module at the revision
# patches/adreno-a830.patch is cut against and the board archive is compiled
# from its sources. Its catalog recipe also produces
# build/adreno740/libAdreno740.a; the archive the kernel force-loads
# (CONFIG_XNU_NATIVE_ADRENO) is build/native-adreno/libNativeAdreno.a, because
# that one also carries the SM8750 platform layer and the firmware blobs.
include = ["ArmCpu", "ArmDTPlatform", "DarwinBoot", "XnuPrelink", "QcomGeniSpi", "Adreno740"]

[kernel]
defconfig = "hummer_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8750.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# Ordered archive plan, run before the kernel link. Selected components with a
# kernel-stage recipe (ArmCpu, ArmDTPlatform, Adreno740) are placed ahead of
# these entries by the resolver, so the plan lists only this board's builders. Scripts run with cwd =
# <work>/tree, and the IPSW members are cached at <out>/ipsw/<build>, i.e.
# ../../../../ipsw from the tree in a format 2 work directory.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-libpthread-kernel.py",
  "build-native-aes.py",
  "build-native-ufs.py --root-windows",
  "build-ufs-storage-bindings.py --kernelcache ../../../../ipsw/21H461/kernelcache.decompressed",
  "build-native-ufs.py --component NativeVirtioBlock --root-windows",
  "build-native-ufs.py --component NativeRamBlock --root-windows",
  "build-sheng-platform-power.py --kernelcache ../../../../ipsw/21H461/kernelcache.decompressed",
  "build-verified-root-probe.py --component os --include-systemos",
  "build-stage7-display.py --kernelcache ../../../../ipsw/21H461/kernelcache.decompressed",
  # hummer touch: Synaptics S3910 on GENI SPI4 (the 13T has a Novatek panel).
  # Called through the weak hook at the end of sheng_pmgr_run() in
  # package/drivers/ShengPlatformPower; off unless hummer-touch=<n> is passed.
  "build-hummer-touch.py",
  # USB CDC debug console (QcomXnuUsbDebug port, soc/Sm8750 profile).
  "build-hummer-usbcdc.py",
  # Adreno 830 register liveness probe. In the plan but disabled: with
  # hummer-adreno-probe=1 it panics in bsd_init and leaves the kgsl/rscc/cxmisc/
  # gpucc readbacks on screen, which is how the GX/CX windows were measured in
  # v142..v148. It never runs otherwise.
  "build-hummer-adreno-probe.py",
  # GPU firmware, then the whole A830 backend.
  #   1. firmware/hummer-gpu holds gmu/sqe/aqe/zap (240 KB) from this phone's
  #      stock OTA: CI has no device to pull them from, and a missing blob stops
  #      this step, which would keep every later board library out of the link.
  #      SQE/AQE must be the phone's own (CP checks the microcode version:
  #      linux-firmware ships 0x77/119 PM4 packets, this phone 0x81/129, and the
  #      wrong pair only ever shows up as "CP never leaves reset"). zap.mbn is cut
  #      at build time into 0xfcc metadata + 0x1000 payload for PAS.
  #   2. driver sources + SM8750 platform layer (GPUCC power, SMMU plan, ZAP,
  #      socinfo, OPP votes) + the A8XX HFI performance table, archived together
  #      with the firmware as strong symbols.
  "fetch-hummer-gpu-firmware.py",
  "build-hummer-adreno-kits.py",
]

[kernel.prelink]
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.iokit.IOStorageFamily", "com.apple.filesystems.apfs",
  "com.apple.driver.AppleMobileFileIntegrity", "com.apple.kext.CoreTrust",
  "com.apple.security.sandbox", "com.apple.driver.ApplePMGR",
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.iokit.IOSurface", "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOHIDFamily", "com.apple.iokit.IOHIDEventDriver",
]

[device_tree]
# The hardware description the common ADT generator consumes: six performance
# cores, the 4 GiB DarwinBoot window, and the SM8750 controller windows from the
# SoC DTSI (GICv3 is exported to arm-io as "intc").
source = "device:dts/hummer.dts"
include_dirs = ["soc:dts"]

[userdata]
# GPT entry "userdata" of this unit (PKR110), 4 KiB sectors.
first_lba = 0x3a1421
last_lba = 0x3ad07fa
lba_bytes = 4096

[payload]
volume = "UNIXNUHUMMER"
size_mib = 160
loader = "firmware"
title = "OnePlus Ace 5 Pro Stage 7"
# Must equal the memory node in dts/hummer.dts: the ADT generator rejects a
# mismatch instead of handing XNU a size the hardware does not have.
dram_size = "0x100000000"
timeout = 10
# Skip Setup (the Hello screen): seed-data-skip-setup.py works on a copy of the
# Data seed and marks Setup finished (purplebuddy SetupDone/SetupFinishedAllSteps,
# notbackedup mini-buddy flags false, managedconfiguration quiet, migration
# buildVersion=21H461). --no-auto-dim keeps SpringBoard from dimming and sleeping
# after ~30 s, which matters while the panel is the only output.
skip_setup_tool = "scripts/seed-data-skip-setup.py"
skip_setup_args = ["--no-auto-dim"]
kernel_args = [
  "-v", "serial=0", "debug=0x14e", "cpus=6", "kt_fixed_zones=240",
  # USB CDC debug console: qcom-usb-debug=1 initialises DWC3 and routes PE_kputc
  # to USB; the host then sees USB\VID_1209&PID_316D\QCOMXNUUSBDEBUG.
  "qcom-usb-debug=1",
  # DEVELOPMENT kernels default disable_kprintf_output to true; without
  # -enable_kprintf_spam the UART goes silent after init.
  "-enable_kprintf_spam",
  "native-ufs-root=1", "native-ufs-diagnostics=1", "sheng-pmgr=2",
  "offline-apfs-load=1", "startup_debug=0", "-no_corpses",
  "sheng-vsync=60", "sheng-vsync-fixed=1", "offline-mobile-graphics-load=1",
  "offline-legacy-register=1", "offline-legacy-phase=4", "offline-legacy-gop=1",
  "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1", "offline-key-events=1", "sheng-aks=1",
  # Six cores from Affinity1 (0x0..0x500). The two Oryon prime cores sit in
  # Affinity2 (0x10000/0x10100) and would collapse onto logical 0, which panics
  # AppleS8000CPU, so the ADT lists only the six Affinity1 cores.
  #   sheng-smp=1      register the secondary cores and send PSCI 0.2 CPU_ON
  #   sheng-smp-gic=1  wake the target core's GICR before CPU_ON (GICv3 needs it)
  "sheng-smp=1", "sheng-smp-gic=1",
  # HAS_IPI is undefined in this kernel, so task_restartable_ranges_synchronize()
  # would wait for an acknowledgement that never arrives. -no_slto_panic makes
  # that thread keep waiting instead of panicking the machine; the lock timeout
  # is widened 40x to match.
  "armcpu-spi-ipi=1", "-no_slto_panic", "ml-timeout-lock-panic-scale=40",
  # Touch needs all four switches to receive a report:
  #   offline-hid-input=1  load IOHIDFamily/IOHIDEventDriver and own the device
  #   offline-hid-home=1   the creation condition the 13T reuses as a master switch
  #   sheng-touch-hid=1    register native_touch_set_sink, build the descriptor
  #   hummer-touch=4       run the S3910 probe up to contact polling and publish
  # fifo=1 keeps the FIFO path (DMA hard-reset the controller); fy=0 drops the Y
  # mirror the sheng panel needs, which inverted this panel.
  "offline-hid-input=1", "offline-hid-home=1", "sheng-touch-hid=1",
  "hummer-touch=4", "hummer-touch-panic=0", "hummer-touch-fifo=1", "hummer-touch-fy=0",
  # Three physical keys, polled at 20 ms with 60 ms debounce:
  #   power = PMK8550 PON pwrkey, volume- = PMK8550 PON resin,
  #   volume+ = PM8550 GPIO6 (the DTS names it vol_down; the hardware is the
  #   other way round). Reported on report 2's Consumer collection inside the
  #   keyboard application, the layout iOS routes as system keys.
  "hummer-keyscan=1",
  # A830 bring-up: package/HummerGpu.cpp, called from the legacy display late
  # probe once IOKit is up. Board inputs (cmd-db, socinfo, QFPROM speed bin ->
  # real OPP votes) -> GPUCC power (GCC/GDSC/PLL/RCGR/branch clocks, RPMH votes
  # for CX and MX) -> GPU SMMU plan (SID 0/1 and GMU SID 5) -> firmware memory ->
  # GMU cold start and the whole gen8 performance table -> CP init -> ZAP
  # authentication -> one PM4 scratch write -> publish -> Metal accelerator.
  # hummer_gpu_start() never panics: a failure is reported and boot continues.
  "hummer-adreno-bringup=1",
]
trust_cache_sha256 = ["7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7"]

[payload.adt]
# Format 2 builds the ADT from dts/hummer.dts with the common generator. The
# Apple identity (root model/target-type, chosen security properties, product
# table) comes from the OS profile; only the payload handoff stays here.
chip_id = "0x8011"
owned_memory_size = "0x100000000"
packed_data_ramdisk = true
unique_chip_id = "required"
# Root volume UUID, matching the owner policy and the boot manifest.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"

[adt.defaults.u32]
# No keys and no sleep: a display that dims after 30 s is unusable for bring-up.
sleep-disabled = 1

[adt.product.string]
model = "hummer"

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

# This unit's UEFI firmware (hummerPkg), validated on the phone; the 13T's
# oneplus13tPkg does not boot here.
[firmware]
config = "hummer"
dsc = "Platforms/OnePlus/hummerPkg/hummer.dsc"
fd = "Build/hummerPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}", "{uefi}/Platforms/OnePlus", "{tree}/package",
  "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/OnePlus", "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "hummer-format2"

[bootimg]
embed_payload = true
