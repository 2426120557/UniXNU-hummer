name: build-kernel

# OnePlus Ace 5 Pro (hummer, SM8750) — 13T (Pagani) pipeline.
# 引擎由 ./unixnu 包装器准备：clone upstream.rev (d9460ebb) + 打 patches/ 三份补丁，
# 缓存后转交引擎自己的 unixnu。保留 hummer 的固件/ADT/触屏。

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: hummer-xnu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare the isolated, patched UniXNU source
        run: |
          TREE=$(./unixnu --prepare)
          echo "UNIXNU_TREE=$TREE" >> "$GITHUB_ENV"

      # Stage 7 用户态兼容补丁（按 /chosen/ephemeral-storage 门控），塞进引擎
      # patches/xnu/ 由 baseline.sh 排序应用（zzzz- 排最后）。
      - name: Stage the Stage 7 userspace-compat patch
        run: cp patches/zzzz-hummer-stage7-compat.patch "$UNIXNU_TREE/patches/xnu/"

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef llvm mtools openssl@3
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          xcodebuild -version

      - name: Fetch the kernel sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/hummer/logs
          ./unixnu defconfig hummer_defconfig
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily 2>&1 | tee out/hummer/logs/actions-fetch.log
          cp unixnu.lock out/hummer/unixnu.lock

      - name: Fetch the IPSW and prepare policies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu ipsw fetch AppleLogo KernelCache OS Cryptex1,SystemOS StaticTrustCache Cryptex1,SystemTrustCache 2>&1 | tee out/hummer/logs/actions-ipsw.log
          ./unixnu tree
          python3 scripts/audit-stage7-display.py out/ipsw/21H461/kernelcache.decompressed
          python3 scripts/prepare-ufs-policies.py --tree out/hummer/tree --inputs out/ipsw/21H461 --openssl-prefix "$(brew --prefix openssl@3)" 2>&1 | tee out/hummer/logs/actions-policies.log
          python3 scripts/prepare-original-trust.py --tree "$UNIXNU_TREE" --inputs out/ipsw/21H461 --output out/hummer/original-static-system.bundle 2>&1 | tee out/hummer/logs/actions-trust.log

      - name: Prepare volatile Data
        run: |
          sudo "$(command -v python3)" scripts/prepare-ram-data.py --tree "$UNIXNU_TREE" --source out/ipsw/21H461/044-76040-038.dmg --systemos out/ipsw/21H461/044-76034-038.dmg --output out/hummer/ram-data --config out/hummer/.config 2>&1 | tee out/hummer/logs/actions-ram-data.log

      - name: Build XNU and the FAT payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if [ -z "$UNIXNU_UNIQUE_CHIP_ID" ]; then
            export UNIXNU_UNIQUE_CHIP_ID="$(python3 -c 'import secrets; print(secrets.token_hex(8))')"
          fi
          ./unixnu build kernel payload -j 3 --trust-cache out/hummer/original-static-system.bundle --data-ramdisk out/hummer/ram-data/data.dbrdisk 2>&1 | tee out/hummer/logs/actions-build.log

      - name: Show build log tail
        if: always()
        run: |
          for f in out/hummer/logs/*.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -n -iE "error:|error |Traceback|raise |fatal:|undefined|No such file|ld: " "$f" | tail -25 || true
          done
          tail -60 out/hummer/logs/actions-build.log 2>/dev/null || true

      - name: Check artifacts
        id: check
        run: |
          K=out/hummer/kernel/kernel.macho
          if [ -f "$K" ]; then echo "KERNEL_BUILT=yes" >> "$GITHUB_ENV"; ls -la "$K"; else echo "KERNEL_BUILT=no" >> "$GITHUB_ENV"; fi
          [ -f out/hummer/payload/payload.img ] && ls -la out/hummer/payload/payload.img || echo "payload.img not produced"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummer-xnu-${{ github.run_number }}
          path: |
            out/hummer/kernel/**
            out/hummer/payload/**
            out/hummer/logs/**
            out/hummer/unixnu.lock
          if-no-files-found: warn
          retention-days: 7

      # 日志可诊断性：job logs 需要 admin、artifacts 需要认证，只有 release 资产
      # 是公开可下载的，所以每轮都把日志打到 ci-latest。删掉这一步就看不到报错。
      - name: Publish build outputs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf ci-logs.tar.gz UniXNU/out/hummer/logs \
            out/hummer/logs out/hummer/kernel/kernel.macho out/hummer/payload/payload.img 2>/dev/null || \
          tar czf ci-logs.tar.gz out/hummer/logs 2>/dev/null || true
          gh release view ci-latest >/dev/null 2>&1 || \
            gh release create ci-latest --title "ci latest" --notes "Rolling build outputs."
          for f in ci-logs.tar.gz out/hummer/kernel/kernel.macho out/hummer/payload/payload.img; do
            [ -f "$f" ] && gh release upload ci-latest "$f" --clobber
          done

      - name: Result
        run: |
          if [ "$KERNEL_BUILT" = "yes" ]; then echo "kernel + payload built"; else echo "kernel did not build"; exit 1; fi
